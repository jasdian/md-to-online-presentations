server {
    listen 443 ssl http2;
    server_name decks.example.com;

    root /var/www/decks/public;
    index index.html;

    # Compiled/minified assets — aggressive cache + pre-compressed
    location /assets/ {
        alias /var/www/decks/dist/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Default: open access to all decks
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Password-protected decks ──
    location /private-demo/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd.d/private-demo;
    }

    # Add more protected decks:
    #   htpasswd -c /etc/nginx/htpasswd.d/<slug> username
    # Then add a location block above
}
