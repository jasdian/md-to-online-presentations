server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets are inside public/assets/ — served directly with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Password-protected decks ──
    location /private-demo/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd.d/private-demo;
        try_files $uri $uri/ =404;
    }
}
